name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/

  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.sertumrosarum/files/screenshots app/build/outputs/screenshots
      - name: Upload UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/screenshots/
